spring:
  application:
    name: barberflow-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barberflow_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    # Flyway cria a estrutura; Hibernate apenas confere o mapeamento das entidades.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
