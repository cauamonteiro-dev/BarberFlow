spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
server:
  address: 0.0.0.0
  port: ${PORT:10000}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
barberflow:
  demo-acessos: false
