services:
  - type: web
    name: barberflow-demo
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /api/auth/csrf
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: DB_HOST
        fromDatabase:
          name: barberflow-demo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: barberflow-demo-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: barberflow-demo-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: barberflow-demo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: barberflow-demo-db
          property: password
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SHOP_NAME
        value: BarberFlow Acadêmico
databases:
  - name: barberflow-demo-db
    plan: free
    region: virginia
    databaseName: barberflow
    user: barberflow
    postgresMajorVersion: "18"
    ipAllowList: []
