    <meta
      name="description"
      content="BarberFlow: clientes, agenda, serviços e assinaturas da sua barbearia."
    />
    <title>BarberFlow • Gestão de barbearias</title>
    <script>
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem("barberflow.theme");
        } catch {}
        const theme =
          saved === "dark" || saved === "light"
            ? saved
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#0c141e" : "#f6f4f0";
      })();
    </script>
