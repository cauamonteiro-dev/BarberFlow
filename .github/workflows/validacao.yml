name: Validar BarberFlow
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Testar e empacotar API
        working-directory: backend
        run: bash mvnw -B verify
      - name: Instalar e compilar interface
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Iniciar ambiente isolado
        run: |
          (cd backend && bash mvnw -B spring-boot:test-run -Dspring-boot.run.main-class=br.com.barberflow.LocalDemoApplication > ../backend.log 2>&1) &
          (cd frontend && npm run dev > ../frontend.log 2>&1) &
          for i in {1..60}; do
            if curl -fs http://127.0.0.1:5173/api/barbearias > /dev/null; then break; fi
            sleep 2
          done
          curl -fs http://127.0.0.1:5173/api/barbearias > /dev/null
      - name: Testar interface real
        working-directory: frontend
        run: npm run test:e2e
      - name: Guardar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-barberflow
          include-hidden-files: true
          path: |
            backend/target/surefire-reports/
            frontend/test-results/
            .local/qa/
            backend.log
            frontend.log
