<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do BarberFlow</title>
  <desc id="desc">O navegador acessa a interface e a API por HTTPS. Um contêiner executa o Spring Boot no Vercel. Spring Security autoriza requisições. Os serviços acessam dados pelo JPA e JDBC. O PostgreSQL no Neon persiste os dados e as sessões. O Flyway aplica as migrações na inicialização.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#28568e"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#132435">
    <text x="80" y="105" font-size="64" font-weight="700">Arquitetura do BarberFlow</text>
    <text x="80" y="153" font-size="30" fill="#344a60">Como o navegador, a aplicação no Vercel e o PostgreSQL no Neon se conectam.</text>
    <path d="M80 171h1760M80 1019h1760" fill="none" stroke="#c9d6e5" stroke-width="2"/>
    <g fill="#eff5fc" stroke="#7196bf" stroke-width="2">
      <rect x="100" y="263" width="460" height="141"/>
      <rect x="730" y="263" width="460" height="141"/>
      <rect x="1360" y="263" width="460" height="141"/>
      <rect x="100" y="624" width="460" height="153"/>
      <rect x="730" y="624" width="460" height="153"/>
      <rect x="1360" y="624" width="460" height="153"/>
      <rect x="100" y="859" width="460" height="95" fill="white"/>
    </g>
    <g fill="none" stroke="#28568e" stroke-width="3" marker-end="url(#arrow)">
      <path d="M560 334h170"/>
      <path d="M1190 334h170"/>
      <path d="M1590 404v220"/>
      <path d="M1360 700h-170"/>
      <path d="M730 700H560"/>
      <path d="M330 859v-82"/>
    </g>
    <text x="645" y="304" text-anchor="middle" font-size="23" fill="#28568e">HTTPS / JSON</text>
    <g text-anchor="middle" font-size="30" font-weight="700">
      <text x="330" y="327">Navegador<tspan x="330" dy="37">React e Axios</tspan></text>
      <text x="960" y="327">Aplicação no Vercel<tspan x="960" dy="37">Spring Boot</tspan></text>
      <text x="1590" y="327">Autenticação e autorização<tspan x="1590" dy="37">Spring Security</tspan></text>
      <text x="1590" y="678">Serviços<tspan x="1590" dy="36">Regras de negócio</tspan><tspan x="1590" dy="36">e transações</tspan></text>
      <text x="960" y="694">Persistência<tspan x="960" dy="37">JPA e JDBC parametrizado</tspan></text>
      <text x="330" y="694">Banco de dados no Neon<tspan x="330" dy="37">PostgreSQL</tspan></text>
      <text x="330" y="916">Flyway na inicialização</text>
    </g>
    <text x="80" y="1056" font-size="24" fill="#344a60">O Spring Boot serve a interface e a API. O Neon guarda dados e sessões.</text>
  </g>
</svg>
